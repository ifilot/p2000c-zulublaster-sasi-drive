[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p2000c-disk-tools"
dynamic = ["version"]
description = "Build bootable Philips P2000C ZuluBlaster CP/M distributions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "p2000c-disk-tools contributors"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.scripts]
p2000c-disk = "p2000c_disk.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["integration: executes CP/M in the native emulator or uses optional reference images"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}
